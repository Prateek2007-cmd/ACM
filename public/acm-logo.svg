<svg xmlns="http://www.w3.org/2000/svg" viewBox="65 15 1430 665" preserveAspectRatio="xMidYMid meet" role="img" aria-label="ACM — Association for Computing Machinery">
  <title>ACM</title>
  <defs>
    <!-- uppercase A C M, drawn with bowed strokes so the material reads as poured glass -->
    <g id="acmGlyphs" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- A -->
      <path d="M186 556 C224 452 274 306 322 156 Q332 134 344 134 Q356 134 366 156 C414 306 464 452 502 556" />
      <path d="M252 416 Q344 398 436 416" />
      <!-- C -->
      <path d="M934 232 C776 240 726 300 726 344 C726 388 776 448 934 456" />
      <!-- M -->
      <path d="M1074 556 C1070 420 1072 226 1078 152 Q1082 132 1096 132 Q1108 132 1116 154 C1146 236 1176 316 1226 424 C1276 316 1306 236 1336 154 Q1344 132 1356 132 Q1370 132 1374 152 C1380 226 1382 420 1378 556" />
    </g>

    <!-- GLASS · the body is clear. Only a faint white film, so the surface is visible at all while
         the page still shows straight through it. Every stop is a pure grey: no hue anywhere. -->
    <linearGradient id="acmGlass" gradientUnits="userSpaceOnUse" x1="0" y1="118" x2="0" y2="580">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.07" />
    </linearGradient>

    <!-- THE EDGE · a bright band where the surface turns away. This is what draws the letterform. -->
    <linearGradient id="acmEdgeLight" gradientUnits="userSpaceOnUse" x1="0" y1="90" x2="0" y2="620">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72" />
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.44" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.52" />
    </linearGradient>

    <!-- …and just inside it the glass darkens: refraction, the band that makes it read as glass -->
    <linearGradient id="acmEdgeDark" gradientUnits="userSpaceOnUse" x1="0" y1="130" x2="0" y2="600">
      <stop offset="0" stop-color="#000000" stop-opacity="0.22" />
      <stop offset="0.6" stop-color="#000000" stop-opacity="0.14" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.26" />
    </linearGradient>

    <!-- the bright edge (103 → 79) and the refraction band behind it (79 → 57) -->
    <mask id="acmEdge" maskUnits="userSpaceOnUse" x="-20" y="-20" width="1620" height="760">
      <use href="#acmGlyphs" stroke="#FFFFFF" stroke-width="103" />
      <use href="#acmGlyphs" stroke="#000000" stroke-width="79" />
    </mask>
    <mask id="acmWall" maskUnits="userSpaceOnUse" x="-20" y="-20" width="1620" height="760">
      <use href="#acmGlyphs" stroke="#FFFFFF" stroke-width="79" />
      <use href="#acmGlyphs" stroke="#000000" stroke-width="57" />
    </mask>

    <filter id="acmShadow" x="-30%" y="-40%" width="160%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <!-- 1 · the soft shadow the mark casts -->
  <g transform="translate(0 12)">
    <use href="#acmGlyphs" stroke="#050505" stroke-width="104" opacity="0.55" filter="url(#acmShadow)" />
  </g>
  <!-- 2 · the glass itself: a faint film, and the page shows through it -->
  <g transform="translate(0 -1)">
    <use href="#acmGlyphs" stroke="url(#acmGlass)" stroke-width="93" />
  </g>
  <!-- 3 · refraction, just inside the edge -->
  <g mask="url(#acmWall)">
    <use href="#acmGlyphs" stroke="url(#acmEdgeDark)" stroke-width="79" />
  </g>
  <!-- 4 · the bright edge -->
  <g mask="url(#acmEdge)">
    <use href="#acmGlyphs" stroke="url(#acmEdgeLight)" stroke-width="103" />
  </g>
  <!-- 5 · one specular running along the top of each stroke -->
  <g transform="translate(0 -6)">
    <use href="#acmGlyphs" stroke="#FFFFFF" stroke-width="12" opacity="0.28" />
  </g>
</svg>
