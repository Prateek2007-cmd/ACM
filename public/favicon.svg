<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ACM">
  <defs>
    <!-- GLASS · a faint white film, pure greys only: the page shows through the letter -->
    <linearGradient id="fGlass" gradientUnits="userSpaceOnUse" x1="0" y1="112" x2="0" y2="400">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08" />
    </linearGradient>
    <!-- the bright edge -->
    <linearGradient id="fEdgeLight" gradientUnits="userSpaceOnUse" x1="0" y1="96" x2="0" y2="410">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.74" />
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.46" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.54" />
    </linearGradient>
    <!-- and the refraction just inside it -->
    <linearGradient id="fEdgeDark" gradientUnits="userSpaceOnUse" x1="0" y1="110" x2="0" y2="400">
      <stop offset="0" stop-color="#000000" stop-opacity="0.22" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.18" />
    </linearGradient>
    <mask id="fEdge" maskUnits="userSpaceOnUse" x="-10" y="-10" width="532" height="532">
      <use href="#fA" stroke="#FFFFFF" stroke-width="84" />
      <use href="#fA" stroke="#000000" stroke-width="62" />
    </mask>
    <mask id="fWall" maskUnits="userSpaceOnUse" x="-10" y="-10" width="532" height="532">
      <use href="#fA" stroke="#FFFFFF" stroke-width="62" />
      <use href="#fA" stroke="#000000" stroke-width="42" />
    </mask>
    <filter id="fShadow" x="-40%" y="-40%" width="180%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="11" />
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g id="fA">
      <path d="M132 392 C172 300 228 200 256 138 Q262 126 270 126 Q278 126 284 138 C312 200 368 300 408 392" />
      <path d="M190 292 Q270 278 350 292" />
    </g>
    <g transform="translate(0 9)">
      <use href="#fA" stroke="#050505" stroke-width="92" opacity="0.52" filter="url(#fShadow)" />
    </g>
    <g transform="translate(0 -1)">
      <use href="#fA" stroke="url(#fGlass)" stroke-width="76" />
    </g>
    <g mask="url(#fWall)">
      <use href="#fA" stroke="url(#fEdgeDark)" stroke-width="62" />
    </g>
    <g mask="url(#fEdge)">
      <use href="#fA" stroke="url(#fEdgeLight)" stroke-width="84" />
    </g>
    <g transform="translate(0 -6)">
      <use href="#fA" stroke="#FFFFFF" stroke-width="11" opacity="0.28" />
    </g>
  </g>
</svg>
